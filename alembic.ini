# Alembic config: schema versioning entry point.
# Run by app/db/session.py init_db() programmatically (stamp/upgrade).
# Manual debug: python -m alembic current / python -m alembic upgrade head
# NOTE: keep this file ASCII-only (alembic reads it with locale encoding on Windows).
[alembic]
script_location = migrations
prepend_sys_path = .
# sqlalchemy.url is resolved by migrations/env.py from DB_PATH env (same as app/db/session.py)

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
