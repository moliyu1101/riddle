<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="icon" type="image/png" href="/logo.png" />
  <meta name="theme-color" content="#FAFAFA" />
  <title>知蠹 Riddle · 自主安全渗透与漏洞挖掘平台</title>
  <script>
    try {
      var u = JSON.parse(localStorage.getItem("riddle-ui-v4") || "{}");
      var t = u.theme || localStorage.getItem("riddle-theme") || "light";
      document.documentElement.setAttribute("data-theme", t);
      if (u.accentHue != null) document.documentElement.style.setProperty("--accent-h", String(u.accentHue));
      if (u.accent2Hue != null) document.documentElement.style.setProperty("--accent2-h", String(u.accent2Hue));
      if (t === "dark" && u.bgHue != null) document.documentElement.style.setProperty("--bg-h", String(u.bgHue));
    } catch (e) {}
  </script>
</head>
<body>
  <div id="app"></div>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
