# ============================================================================
#  知蠹 Riddle  ——  AI 自主漏洞挖掘平台
#  Powered By moliyu1101
#  一键启动：  cp .env.example .env  &&  编辑 .env 填 LLM_API_KEY  &&  docker compose up -d --build
#  或直接运行引导脚本：  bash scripts/install.sh
# ============================================================================
services:
  riddle:
    build: .
    image: riddle:latest
    container_name: riddle
    ports:
      # 宿主机端口:容器端口。改宿主机端口：在 .env 里设 RIDDLE_HOST_PORT
      - "${RIDDLE_HOST_PORT:-18800}:18800"
    env_file:
      - .env
    environment:
      - DB_PATH=/app/data/riddle.db
      - WORKER_WORK_ROOT=/work
      - LLM_REQUEST_TIMEOUT=300
    volumes:
      - riddle_data:/app/data        # SQLite + 证据持久化（重启恢复依赖，勿删）
      - riddle_work:/work            # worker 临时工作区
    restart: unless-stopped      # 崩溃自动重启，从 DB 恢复任务状态
    # 资源上限：README 建议 2C4G 起；cgroup 上限防 worker 失控把宿主机拖死。
    # 机器富余可调大，但请始终保留上限——LLM 驱动的真实工具链行为不可完全预测。
    mem_limit: 4g
    cpus: 2.0
    # 7×24 运行，json-file 日志驱动默认无上限会吃满宿主机磁盘
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "5"
    # 容器内端口固定 18800（与 RIDDLE_HOST_PORT 无关）
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:18800/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

volumes:
  riddle_data:
  riddle_work:
